<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atestado - Dr. George Fernandes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem("clinica-login-liberado") !== "true") {
            window.location.href = "index.html";
        }
    </script>
</head>
<body class="certificate-page">
    <section class="section" id="atestado">
        <div class="section-head">
            <h2>Atestado</h2>
            <p>Preencha os dados e gere um atestado pronto para imprimir em papel timbrado.</p>
        </div>
        <div class="exam-request-card">
            <div class="exam-field">
                <label for="cert-paciente">Paciente</label>
                <input id="cert-paciente" type="text" placeholder="Nome completo">
            </div>
            <div class="exam-field">
                <label for="cert-cpf">CPF</label>
                <input id="cert-cpf" type="text" placeholder="000.000.000-00">
            </div>
            <div class="exam-field">
                <label for="cert-nascimento">Data de nascimento</label>
                <input id="cert-nascimento" type="date">
            </div>
            <div class="exam-field">
                <label for="cert-data">Data do atendimento</label>
                <input id="cert-data" type="date">
            </div>
            <div class="exam-field">
                <label for="cert-tipo">Tipo</label>
                <select id="cert-tipo">
                    <option value="comparecimento">Comparecimento</option>
                    <option value="afastamento">Afastamento/repouso</option>
                </select>
            </div>
            <div class="exam-field">
                <label for="cert-horario">Horario</label>
                <input id="cert-horario" type="text" placeholder="Ex: 08h as 09h">
            </div>
            <div class="exam-field">
                <label for="cert-dias">Dias de afastamento</label>
                <input id="cert-dias" type="number" min="1" value="1">
            </div>
            <div class="exam-field exam-wide">
                <label for="cert-motivo">Texto do afastamento/repouso</label>
                <textarea id="cert-motivo" rows="2" placeholder="Ex: necessitando de repouso somente durante o tratamento">necessitando de repouso/afastamento por 1 dia, a partir desta data.</textarea>
            </div>
            <div class="exam-field">
                <label for="cert-cid">CID/Observacao clinica</label>
                <input id="cert-cid" type="text" placeholder="Opcional">
            </div>
            <div class="exam-field">
                <label for="cert-problema">Problema/diagnostico</label>
                <input id="cert-problema" type="text" placeholder="Ex: fratura de radio">
            </div>
            <div class="exam-field">
                <label for="cert-profissional">Profissional</label>
                <input id="cert-profissional" type="text" value="Dr. George Fernandes">
            </div>
            <div class="exam-field">
                <label for="cert-crefito">CREFITO</label>
                <input id="cert-crefito" type="text" value="331783-F">
            </div>
            <div class="exam-field exam-wide">
                <label for="cert-observacoes">Observacoes extras</label>
                <textarea id="cert-observacoes" rows="3" placeholder="Ex: paciente esteve em atendimento fisioterapeutico nesta clinica"></textarea>
            </div>
            <div class="exam-actions">
                <button id="cert-generate" type="button">Gerar e imprimir</button>
                <button id="cert-clear" type="button">Limpar</button>
            </div>
        </div>
    </section>

    <script>
        const certPaciente = document.getElementById("cert-paciente");
        const certCpf = document.getElementById("cert-cpf");
        const certNascimento = document.getElementById("cert-nascimento");
        const certData = document.getElementById("cert-data");
        const certTipo = document.getElementById("cert-tipo");
        const certHorario = document.getElementById("cert-horario");
        const certDias = document.getElementById("cert-dias");
        const certMotivo = document.getElementById("cert-motivo");
        const certCid = document.getElementById("cert-cid");
        const certProblema = document.getElementById("cert-problema");
        const certProfissional = document.getElementById("cert-profissional");
        const certCrefito = document.getElementById("cert-crefito");
        const certObservacoes = document.getElementById("cert-observacoes");
        const certGenerate = document.getElementById("cert-generate");
        const certClear = document.getElementById("cert-clear");

        function escapeHtml(value) {
            return `${value || ""}`
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatDateBr(value) {
            if (!value) return "";
            const [year, month, day] = value.split("-");
            if (!year || !month || !day) return value;
            return `${day}/${month}/${year}`;
        }

        function setDefaultCertificateDate() {
            if (certData && !certData.value) {
                certData.value = new Date().toISOString().slice(0, 10);
            }
        }

        function getDefaultCertificateReason(days) {
            return `necessitando de repouso/afastamento por ${days} ${days === 1 ? "dia" : "dias"}, a partir desta data.`;
        }

        function syncCertificateReasonWithDays() {
            if (!certDias || !certMotivo) return;
            const days = Math.max(1, Number(certDias.value) || 1);
            const defaultReasons = [
                getDefaultCertificateReason(1),
                getDefaultCertificateReason(days - 1),
                getDefaultCertificateReason(days + 1)
            ];
            if (!certMotivo.value.trim() || defaultReasons.includes(certMotivo.value.trim())) {
                certMotivo.value = getDefaultCertificateReason(days);
            }
        }

        function getCertificateText(patient, serviceDate) {
            const type = certTipo.value;
            const schedule = certHorario.value.trim();
            const days = Math.max(1, Number(certDias.value) || 1);
            const defaultReason = getDefaultCertificateReason(days);
            const reason = (certMotivo.value.trim() || defaultReason).replace("{dias}", `${days}`).replace("{dia}", days === 1 ? "dia" : "dias");
            const cid = certCid.value.trim();
            const problem = certProblema.value.trim();
            const notes = certObservacoes.value.trim();
            const scheduleText = schedule ? `, no horario de ${escapeHtml(schedule)}` : "";
            const problemText = problem ? ` Diagnostico/problema informado: ${escapeHtml(problem)}.` : "";
            const cidText = cid ? ` CID/observacao clinica: ${escapeHtml(cid)}.` : "";
            const notesText = notes ? `<p>${escapeHtml(notes)}</p>` : "";

            if (type === "afastamento") {
                return `
                    <p>Atesto, para os devidos fins, que o(a) paciente <strong>${escapeHtml(patient)}</strong> esteve em atendimento fisioterapeutico nesta clinica em ${escapeHtml(serviceDate)}${scheduleText}, ${escapeHtml(reason)}${problemText}${cidText}</p>
                    ${notesText}
                `;
            }

            return `
                <p>Declaro, para os devidos fins, que o(a) paciente <strong>${escapeHtml(patient)}</strong> compareceu a atendimento fisioterapeutico nesta clinica em ${escapeHtml(serviceDate)}${scheduleText}.${problemText}${cidText}</p>
                ${notesText}
            `;
        }

        function printCertificate() {
            const patient = certPaciente.value.trim();
            if (!patient) {
                window.alert("Digite o nome do paciente.");
                certPaciente.focus();
                return;
            }

            setDefaultCertificateDate();
            const serviceDate = formatDateBr(certData.value) || formatDateBr(new Date().toISOString().slice(0, 10));
            const professional = certProfissional.value.trim() || "Dr. George Fernandes";
            const crefito = certCrefito.value.trim();
            const signatureCrefito = crefito ? `Fisioterapeuta - CREFITO - ${crefito}` : "Fisioterapeuta";
            const documentTitle = certTipo.value === "afastamento" ? "Atestado" : "Declaracao de comparecimento";
            const headerImageUrl = new URL("imagens/cabeçalho.png", window.location.href).href;
            const watermarkImageUrl = new URL("imagens/marca-dagua.png", window.location.href).href;
            const printWindow = window.open("", "_blank", "width=900,height=700");
            if (!printWindow) return;

            const html = `<!doctype html>
                <html lang="pt-BR">
                <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1">
                    <title>${escapeHtml(documentTitle)} - ${escapeHtml(patient)}</title>
                    <style>
                        @page { size: A4; margin: 0; }
                        * { box-sizing: border-box; }
                        body { margin: 0; background: #fff; color: #111; font-family: Arial, sans-serif; font-size: 12pt; }
                        .letter-page { position: relative; width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; padding: 18mm 15mm 32mm; overflow: hidden; }
                        .letter-header { display: flex; justify-content: center; margin-bottom: 34px; }
                        .header-logo { display: block; width: 150px; height: auto; }
                        .watermark { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.48; z-index: 0; }
                        .watermark img { width: 470px; height: auto; }
                        .letter-content { position: relative; z-index: 1; }
                        h1 { margin: 0 0 24px; text-align: center; font-size: 12pt; text-transform: uppercase; }
                        .patient-data { margin-bottom: 26px; line-height: 1.35; font-size: 12pt; overflow-wrap: anywhere; }
                        p { margin: 0 0 12px; line-height: 1.7; text-align: justify; overflow-wrap: anywhere; }
                        .document-closing { position: absolute; left: 21mm; bottom: 82mm; padding-top: 0; z-index: 1; }
                        .signature { width: 330px; margin: 0; text-align: center; page-break-inside: avoid; }
                        .signature-line { width: 100%; margin: 0 auto 8px; border-top: 1px solid #111; }
                        .signature strong, .signature span { display: block; overflow-wrap: normal; word-break: keep-all; white-space: nowrap; }
                        .signature span { margin-top: 4px; font-weight: 700; }
                        .letter-footer { position: absolute; left: 15mm; right: 15mm; bottom: 10mm; text-align: center; font-size: 10px; line-height: 1.35; z-index: 1; page-break-inside: avoid; }
                        @media print {
                            body { background: #fff; }
                            .letter-page { width: auto; min-height: 297mm; margin: 0; padding: 18mm 15mm 32mm; overflow: visible; }
                            .document-closing { position: fixed; left: 21mm; bottom: 82mm; }
                            .letter-footer { position: fixed; left: 15mm; right: 15mm; bottom: 12mm; }
                        }
                    </style>
                </head>
                <body>
                    <main class="letter-page">
                        <div class="watermark"><img src="${escapeHtml(watermarkImageUrl)}" alt=""></div>
                        <header class="letter-header">
                            <img class="header-logo" src="${escapeHtml(headerImageUrl)}" alt="Dr. George Fernandes">
                        </header>
                        <section class="letter-content">
                            <h1>${escapeHtml(documentTitle)}</h1>
                            <div class="patient-data">
                                <div><strong>Paciente:</strong> ${escapeHtml(patient)}</div>
                                ${certCpf.value.trim() ? `<div><strong>CPF:</strong> ${escapeHtml(certCpf.value.trim())}</div>` : ""}
                                ${certNascimento.value ? `<div><strong>Data de nascimento:</strong> ${escapeHtml(formatDateBr(certNascimento.value))}</div>` : ""}
                                <div><strong>Data:</strong> ${escapeHtml(serviceDate)}</div>
                            </div>
                            ${getCertificateText(patient, serviceDate)}
                            <div class="document-closing">
                                <div class="signature">
                                    <div class="signature-line"></div>
                                    <strong>${escapeHtml(professional)}</strong>
                                    <span>${escapeHtml(signatureCrefito)}</span>
                                </div>
                            </div>
                        </section>
                        <footer class="letter-footer">
                            G F da C Silva Fisioterapia LTDA<br>
                            CNPJ: 53.828.385/0001-46<br>
                            Rua das Jacas, 291 - Vila Emanuela<br>
                            65939-000 - Itinga do Maranhão
                        </footer>
                    </main>
                    <script>
                        window.onload = () => {
                            const images = Array.from(document.images);
                            Promise.all(images.map((image) => {
                                if (image.complete) return Promise.resolve();
                                return new Promise((resolve) => {
                                    image.addEventListener("load", resolve, { once: true });
                                    image.addEventListener("error", resolve, { once: true });
                                });
                            })).then(() => {
                                setTimeout(() => window.print(), 250);
                            });
                        };
                    <\/script>
                </body>
                </html>`;

            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();
        }

        function clearCertificate() {
            certPaciente.value = "";
            certCpf.value = "";
            certNascimento.value = "";
            certTipo.selectedIndex = 0;
            certHorario.value = "";
            certDias.value = "1";
            certMotivo.value = getDefaultCertificateReason(1);
            certCid.value = "";
            certProblema.value = "";
            certProfissional.value = "Dr. George Fernandes";
            certCrefito.value = "331783-F";
            certObservacoes.value = "";
            setDefaultCertificateDate();
            certPaciente.focus();
        }

        setDefaultCertificateDate();
        syncCertificateReasonWithDays();
        certDias.addEventListener("input", syncCertificateReasonWithDays);
        certDias.addEventListener("change", syncCertificateReasonWithDays);
        certGenerate.addEventListener("click", printCertificate);
        certClear.addEventListener("click", clearCertificate);
    </script>
</body>
</html>
